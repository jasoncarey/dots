# --- Prefix: Ctrl+a instead of Ctrl+b ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# --- Vim-like pane navigation ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Splits ---
bind v split-window -h
bind s split-window -v

# --- Close pane ---
bind x kill-pane

# --- Worktree fleet ---
# prefix+f : fuzzy-switch between worktree sessions (the fleet).
bind f display-popup -E -w 66 -h 12 -S 'fg=#268bd3' "~/dev/dots/tmux/wt-switch.sh"

# Clear a session's attention flag once you switch into it.
set-hook -g client-session-changed 'set-option @attention 0'

# --- Windows (tabs) ---
bind c new-window
bind n next-window
bind p previous-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# --- Faster escape ---
set -sg escape-time 0

# --- Mouse (optional but nice) ---
set -g mouse on

# --- Copy: mouse drag -> pbcopy ---
set -s set-clipboard on
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# --- Resize panes ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Status bar theme ---
# Toggle with the `theme` fish command (`theme solarized` / `theme default`),
# which rewrites the path below and live-reloads. Copy-mode styles are set
# literally in the sourced file: their default "#{E:mode-style}" re-expands
# "#F..." hex into a tmux format code, dropping the selection bg.
source-file ~/dev/dots/tmux/themes/cyberpunk.conf

set-option -g default-shell /opt/homebrew/bin/fish
set-option -g default-command /opt/homebrew/bin/fish

# --- Plugins: session persistence across reboots (tpm) ---
# tpm itself lives outside this repo; bootstrap on a new machine with:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# then `prefix + I` inside tmux to install the plugins below.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: sessions, windows, layouts, window names, per-window cwd.
set -g @resurrect-dir '~/.tmux/resurrect'
# Pane scrollback capture stays OFF: resurrect names its capture files
# "pane-<session>:<win>.<pane>", and fleet session names contain a slash
# (`repo/worktree`), so the writes land on a non-existent path and fail.
set -g @resurrect-capture-pane-contents 'off'
# nvim is in resurrect's default restore list. `claude` is deliberately NOT:
# a restored window would start a *fresh* conversation. Instead the claude
# window comes back as a fish shell in the right worktree — run
# `claude --continue` there to pick the conversation back up.
# Manual save: prefix + C-s   Manual restore: prefix + C-r

# continuum: autosave every 15 min, auto-restore when the tmux server starts.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Must stay last.
run '~/.tmux/plugins/tpm/tpm'
